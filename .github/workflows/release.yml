on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

name: Release desktop installers

# Least privilege: jobs may publish to GitHub Releases and nothing else.
# No third-party tokens; GITHUB_TOKEN is scoped per-run. Signing
# credentials are optional secrets (see DESKTOP.md) — builds currently
# produce unsigned installers.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Canonical artifact names. README download links must match these
  # exactly. Build steps copy native Tauri output to these names.
  MAC_ARM64_ARTIFACT: Vaultfolio-macOS-arm64.dmg
  MAC_X64_ARTIFACT: Vaultfolio-macOS-x64.dmg
  WIN_X64_ARTIFACT: Vaultfolio-Windows-x64-setup.exe

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Frontend checks
        run: |
          npm run typecheck
          npm test
          npm run build

  create-draft:
    needs: quality-gate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        run: |
          cat > release-notes.md <<'NOTES'
          ## Download Vaultfolio

          | Platform | File |
          | --- | --- |
          | macOS — Apple Silicon (M-series) | `Vaultfolio-macOS-arm64.dmg` |
          | macOS — Intel | `Vaultfolio-macOS-x64.dmg` |
          | Windows 10/11 — x64 | `Vaultfolio-Windows-x64-setup.exe` |

          ## What's new
          - Market Watch adds optional international USD reference quotes for gold,
            silver, platinum, palladium, and copper through GoldAPI.io with the
            keyless gold-api.com fallback covering all five metals (copper via COMEX
            HG, mapped to XCU) — live fetching works with zero configuration.
          - Price observations are validated and kept on-device, with freshness and
            provider status plus interactive charts over the observations collected
            on that device. This release does not claim historical provider backfill.
          - **AI Market Reports** (new in 1.0.5): optional structured reports via the
            user's own Gemini key (gemini-2.5-flash, native JSON schema, locally
            re-validated). Reports are assembled from on-device provider
            observations only — missing windows are labelled incomplete, never
            filled with invented data.
          - Portfolio Analytics & Insights includes allocation, cost-versus-value,
            top-holding, and logged portfolio-valuation charts.

          ## Market data and limitations
          - Market Watch fetching works out of the box via the keyless gold-api.com
            fallback; GoldAPI.io remains an optional primary source with the user's
            own key. Its USD references and any LKR conversion are not Sri
            Lankan dealer prices.
          - Gemini is not required: without a user-configured key, Reports show
            setup guidance only. An exhausted Gemini quota does not affect the
            local vault, portfolio, or Market Watch.

          ### Install notes
          - The macOS builds and the Windows build are currently **unsigned**:
            - macOS first launch: right-click the app → **Open** (bypasses
              Gatekeeper for this app without changing system security).
            - Windows first launch: choose **More info → Run anyway** if
              SmartScreen shows a warning.
          - The app works fully offline: create a local encrypted vault on first
            launch — no account or API keys are required. Cloud sync (via your own
            Supabase project) is optional.
          - Release builds must not include `.env` files, Gemini credentials, or
            market-provider keys. `VITE_*` settings are client-visible if supplied
            at build time, so users should configure their own low-privilege keys.
          NOTES
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --draft \
            --title "Vaultfolio ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  macos:
    needs: create-draft
    name: macOS installers (arm64 + x64)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
      - run: npm ci
      # `frontendDist` is embedded by Cargo. Clear only this app crate so a
      # restored Rust cache cannot retain an earlier JavaScript/CSS bundle.
      - name: Clear embedded frontend cache
        run: cargo clean -p vaultfolio
        working-directory: src-tauri
      - name: Build Apple Silicon dmg
        run: npx tauri build --target aarch64-apple-darwin --config src-tauri/tauri.macos.json
      - name: Build Intel dmg
        run: npx tauri build --target x86_64-apple-darwin --config src-tauri/tauri.macos.json
      - name: Validate-sign apps and rebuild DMGs
        # Tauri's default ad-hoc signature can be invalid after the bundle is
        # assembled. Re-sign the finished app and then create the DMG from that
        # verified bundle. This is not Developer ID signing or notarization, but
        # it prevents macOS from reporting the app as damaged.
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            app="src-tauri/target/${target}/release/bundle/macos/Vaultfolio.app"
            dmg="src-tauri/target/${target}/release/bundle/dmg/Vaultfolio_${GITHUB_REF_NAME#v}_$( [ "$target" = aarch64-apple-darwin ] && echo aarch64 || echo x64 ).dmg"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            hdiutil create -volname Vaultfolio -srcfolder "$app" -ov -format UDZO "$dmg"
            hdiutil verify "$dmg"
          done
      - name: Normalize artifact names
        run: |
          mkdir -p dist-desktop
          cp "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Vaultfolio_${GITHUB_REF_NAME#v}_aarch64.dmg" "dist-desktop/${MAC_ARM64_ARTIFACT}"
          cp "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/Vaultfolio_${GITHUB_REF_NAME#v}_x64.dmg" "dist-desktop/${MAC_X64_ARTIFACT}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: dist-desktop/*.dmg
          if-no-files-found: error
      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${GITHUB_REF_NAME}" dist-desktop/*.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  windows:
    needs: create-draft
    name: Windows installer (x64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
      - run: npm ci
      # `frontendDist` is embedded by Cargo. Clear only this app crate so a
      # restored Rust cache cannot retain an earlier JavaScript/CSS bundle.
      - name: Clear embedded frontend cache
        run: cargo clean -p vaultfolio
        working-directory: src-tauri
      - name: Build NSIS installer
        run: npx tauri build --config src-tauri/tauri.windows.json
      - name: Normalize artifact names
        run: |
          mkdir -p dist-desktop
          cp "src-tauri/target/release/bundle/nsis/Vaultfolio_${GITHUB_REF_NAME#v}_x64-setup.exe" "dist-desktop/${WIN_X64_ARTIFACT}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-desktop/*.exe
          if-no-files-found: error
      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${GITHUB_REF_NAME}" dist-desktop/*.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [macos, windows]
    name: Publish release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish draft release
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
