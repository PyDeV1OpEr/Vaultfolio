on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

name: Release desktop installers

permissions:
  contents: read

# Least privilege: jobs may publish to GitHub Releases and nothing else.
# No third-party tokens; GITHUB_TOKEN is scoped per-run. macOS Developer ID
# signing + notarization activate ONLY when the five APPLE_* secrets are
# configured (see DESKTOP.md); otherwise the ad-hoc legacy path runs and the# release notes must not claim notarization.
defaults:
  run:
    shell: bash

env:
  # Canonical artifact names. README download links must match these
  # exactly. Build steps copy native Tauri output to these names.
  MAC_ARM64_ARTIFACT: Vaultfolio-macOS-arm64.dmg
  MAC_X64_ARTIFACT: Vaultfolio-macOS-x64.dmg
  WIN_X64_ARTIFACT: Vaultfolio-Windows-x64-setup.exe

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Frontend checks
        run: |
          npm run typecheck
          npm test
          npm run build

  create-draft:
    needs: quality-gate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        run: |
          cat > release-notes.md <<'NOTES'
          ## Download Vaultfolio

          | Platform | File |
          | --- | --- |
          | macOS — Apple Silicon (M-series) | `Vaultfolio-macOS-arm64.dmg` |
          | macOS — Intel | `Vaultfolio-macOS-x64.dmg` |
          | Windows 10/11 — x64 | `Vaultfolio-Windows-x64-setup.exe` |

          ## What's new
          - Market Watch adds optional international USD reference quotes for gold,
            silver, platinum, palladium, and copper through GoldAPI.io with the
            keyless gold-api.com fallback covering all five metals (copper via COMEX
            HG, mapped to XCU) — live fetching works with zero configuration.
          - Price observations are validated and kept on-device, with freshness and
            provider status plus interactive charts over the observations collected
            on that device. This release does not claim historical provider backfill.
          - **AI Market Reports** (new in 1.0.5): optional structured reports via the
            user's own Gemini key (gemini-2.5-flash, native JSON schema, locally
            re-validated). Reports are assembled from on-device provider
            observations only — missing windows are labelled incomplete, never
            filled with invented data.
          - Portfolio Analytics & Insights includes allocation, cost-versus-value,
            top-holding, and logged portfolio-valuation charts.

          ## Market data and limitations
          - Market Watch fetching works out of the box via the keyless gold-api.com
            fallback; GoldAPI.io remains an optional primary source with the user's
            own key. Its USD references and any LKR conversion are not Sri
            Lankan dealer prices.
          - Gemini is not required: without a user-configured key, Reports show
            setup guidance only. An exhausted Gemini quota does not affect the
            local vault, portfolio, or Market Watch.

          ### Install notes
          - macOS builds are **Developer ID signed and notarized** when the
            repository's APPLE_* secrets are configured; the release notes will
            say so explicitly only on a build where Apple actually accepted the
            notarization. Builds without those secrets are ad-hoc signed:
            - macOS first launch: right-click the app → **Open** (bypasses
              Gatekeeper for this app without changing system security).
            - Windows first launch: choose **More info → Run anyway** if
              SmartScreen shows a warning.
          - The app works fully offline: create a local encrypted vault on first
            launch — no account or API keys are required. Cloud sync (via your own
            Supabase project) is optional.
          - Release builds must not include `.env` files, Gemini credentials, or
            market-provider keys. `VITE_*` settings are client-visible if supplied
            at build time, so users should configure their own low-privilege keys.
          NOTES
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --draft \
            --title "Vaultfolio ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  macos:
    needs: create-draft
    name: macOS installers (arm64 + x64)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
      - run: npm ci

      # ── Developer ID signing (conditional) ──────────────────────────────
      # Requires two config secrets to activate:
      #   APPLE_CERTIFICATE            base64-exported Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD   export password for that .p12
      # Notarization additionally requires:
      #   APPLE_ID                     Apple ID email used for App Store Connect
      #   APPLE_APP_SPECIFIC_PASSWORD  app-specific password (appleid.apple.com)
      #   APPLE_TEAM_ID                10-char team id that owns the certificate
      # Missing identities keep the ad-hoc path and the release notes stay honest.
      - name: Import Developer ID certificate (if provided)
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD secrets are not set — building the ad-hoc (unsigned for distribution) variant. Gatekeeper will warn on first launch."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/dev-cert.p12
          KEYCHAIN_PW="vf-keychain-$(date +%s)"
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security import /tmp/dev-cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Allow codesign (and its signing helpers) on the new keychain.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" build.keychain > /dev/null
          rm -f /tmp/dev-cert.p12
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/{print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::The imported .p12 contains no 'Developer ID Application' certificate. Export the right certificate and re-encode with base64."
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=build.keychain" >> "$GITHUB_OUTPUT"

      # `frontendDist` is embedded by Cargo. Clear only this app crate so a
      # restored Rust cache cannot retain an earlier JavaScript/CSS bundle.
      - name: Clear embedded frontend cache
        run: cargo clean -p vaultfolio
        working-directory: src-tauri

      - name: Build Apple Silicon and Intel installers (signing as configured)
        # Job-level env cannot reference steps.* outputs, so the Tauri signing
        # vars are set on this step only. APPLE_SIGNING_IDENTITY '-' = ad-hoc
        # fallback path (no secrets configured).
        env:
          APPLE_KEYCHAIN: ${{ steps.signing.outputs.enabled == 'true' && steps.signing.outputs.keychain || '' }}
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.enabled == 'true' && steps.signing.outputs.identity || '-' }}
        run: |
          npx tauri build --target aarch64-apple-darwin --config src-tauri/tauri.macos.json
          npx tauri build --target x86_64-apple-darwin --config src-tauri/tauri.macos.json

      - name: Validate and package DMGs
        # With a Developer ID identity: keep Tauri's hardened-runtime signature
        # (never levels it down with ad-hoc re-signing), verify it strictly.
        # Without one: rebuild the ad-hoc signature after bundling so macOS does
        # not report the app as damaged (fallback path only).
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            app="src-tauri/target/${target}/release/bundle/macos/Vaultfolio.app"
            dmg="src-tauri/target/${target}/release/bundle/dmg/Vaultfolio_${GITHUB_REF_NAME#v}_$( [ "$target" = aarch64-apple-darwin ] && echo aarch64 || echo x64 ).dmg"
            if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
              codesign --verify --deep --strict --verbose=2 "$app"
              echo "Developer ID signature verified for target $target"
            else
              codesign --force --deep --sign - "$app"
              codesign --verify --deep --strict --verbose=2 "$app"
            fi
            # Drag-and-drop layout: app plus Applications shortcut side by side.
            stage="src-tauri/target/${target}/release/bundle/dmg/dmg-stage"
            rm -rf "$stage" && mkdir -p "$stage"
            cp -R "$app" "$stage/Vaultfolio.app"
            ln -s /Applications "$stage/Applications"
            hdiutil create -volname Vaultfolio -srcfolder "$stage" -ov -format UDZO "$dmg"
            hdiutil verify "$dmg"
          done

      # ── Notarization (conditional) ─────────────────────────────────────
      # Submits BOTH finished DMGs to Apple via notarytool, waits for the
      # result, staples the ticket, and validates. A rejection fails the job
      # before anything is uploaded, and prints the notarization log.
      - name: Notarize DMGs with notarytool (if credentials provided)
        id: notary
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::notice::Signing secrets present but APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID not set — skipping notarization. The DMGs will be Developer ID-signed but NOT notarized."
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "notarized=true" >> "$GITHUB_OUTPUT"
          # Store credentials once in the build keychain; the app-specific
          # password never appears on a command line as a positional arg.
          xcrun notarytool store-credentials VAULTFOLIO_NOTARY \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain build.keychain
          for title in arm64 x64; do
            dmg="src-tauri/target/*-apple-darwin/release/bundle/dmg/Vaultfolio_${GITHUB_REF_NAME#v}_${title}.dmg"
            dmg=$(ls $dmg | head -1)
            echo "Submitting $dmg to Apple notarization…"
            if ! xcrun notarytool submit "$dmg" \
                 --keychain-profile VAULTFOLIO_NOTARY \
                 --keychain build.keychain \
                 --wait \
                 --output-format json \
                 | tee /tmp/notary-"$title".json; then
              submission_id=$(python3 -c "import json,sys;print(json.load(open('/tmp/notary-"$title".json')).get('id',''))" 2>/dev/null || true)
              if [ -n "$submission_id" ]; then
                echo "::error::Notarization rejected; fetching Apple's log for submission $submission_id:"
                xcrun notarytool log "$submission_id" --keychain-profile VAULTFOLIO_NOTARY --keychain build.keychain || true
              fi
              exit 1
            fi
            echo "Stapling ticket onto $dmg…"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done
          echo "::notice::Both DMGs notarized and stapled successfully."

      - name: Normalize artifact names
        run: |
          mkdir -p dist-desktop
          cp "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Vaultfolio_${GITHUB_REF_NAME#v}_aarch64.dmg" "dist-desktop/${MAC_ARM64_ARTIFACT}"
          cp "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/Vaultfolio_${GITHUB_REF_NAME#v}_x64.dmg" "dist-desktop/${MAC_X64_ARTIFACT}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: dist-desktop/*.dmg
          if-no-files-found: error
      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${GITHUB_REF_NAME}" dist-desktop/*.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  windows:
    needs: create-draft
    name: Windows installer (x64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
      - run: npm ci
      # `frontendDist` is embedded by Cargo. Clear only this app crate so a
      # restored Rust cache cannot retain an earlier JavaScript/CSS bundle.
      - name: Clear embedded frontend cache
        run: cargo clean -p vaultfolio
        working-directory: src-tauri
      - name: Build NSIS installer
        run: npx tauri build --config src-tauri/tauri.windows.json
      - name: Normalize artifact names
        run: |
          mkdir -p dist-desktop
          cp "src-tauri/target/release/bundle/nsis/Vaultfolio_${GITHUB_REF_NAME#v}_x64-setup.exe" "dist-desktop/${WIN_X64_ARTIFACT}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-desktop/*.exe
          if-no-files-found: error
      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${GITHUB_REF_NAME}" dist-desktop/*.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [macos, windows]
    name: Publish release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish draft release
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
